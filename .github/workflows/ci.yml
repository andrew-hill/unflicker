name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift test
      # The README tells people to build this way; CI should prove it works.
      - run: swift build -c release
      # Contributors and CI have no team membership; compiling is all this asserts.
      - run: xcodebuild -project app/unflicker.xcodeproj -scheme unflicker -configuration Release CODE_SIGNING_ALLOWED=NO build
